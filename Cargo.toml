[package]
name = "iconhunt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Search 450,000+ open-source icons from the terminal: Iconify search with Japanese keywords, previews drawn in the terminal, license classes (attribution, copyleft, non-commercial) and a credits generator. Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/iconhunt"
homepage = "https://github.com/printemps-tokyo/iconhunt"
readme = "README.md"
keywords = ["icons", "iconify", "svg", "search", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "iconhunt"
path = "src/main.rs"

[lib]
name = "iconhunt"
path = "src/lib.rs"

[dependencies]
# Error context for the thin binary layer (org convention).
anyhow = "1"
# Argument parsing (derive API, org convention); `env` for ICONHUNT_API.
clap = { version = "4", features = ["derive", "env"] }
# Blocking HTTP client for the Iconify API (rustls, gzip by default).
ureq = "3"
# Typed views of the API responses, and --json output.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rasterizing SVG for terminal previews and PNG export. Text and raster image
# support are off: icons are paths, and nothing is read from disk.
resvg = { version = "0.49", default-features = false }
# Fitting the preview grid to the terminal.
terminal_size = "0.4"

[dev-dependencies]
# Scratch directories for the CLI integration tests.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
